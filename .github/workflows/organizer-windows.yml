name: Organizer Windows CI

on:
  push:
    branches: [feat/media-organizer-workbench-20261014]
    paths:
      - 'organizer/**'
      - '.github/workflows/organizer-windows.yml'
  pull_request:
    branches: [master, develop, feat/media-organizer-workbench-20261014]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'organizer/**'
      - '.github/workflows/organizer-windows.yml'
  workflow_dispatch:

# No secrets, package publishing, deployment, release, or write-capable checkout.
permissions:
  contents: read
concurrency:
  group: organizer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_NOLOGO: '1'
  MSBUILDDISABLENODEREUSE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  verify:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.402'
          cache: true
          cache-dependency-path: organizer/**/packages*.lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install hash-locked official HTTP test dependencies
        run: |
          python -m pip --isolated install --require-hashes --only-binary=:all: --no-deps -r organizer/worker/requirements-live.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Offline aggregate (generated media, fixtures, and mock HTTP only)
        run: |
          New-Item -ItemType Directory -Force organizer/artifacts/ci | Out-Null
          & pwsh -NoProfile -File ./organizer/scripts/check.ps1 *> organizer/artifacts/ci/checks.log
          $result = $LASTEXITCODE
          Get-Content organizer/artifacts/ci/checks.log
          if ($result -ne 0) { exit $result }
      - name: Prove telemetry guard rejects missing environment opt-out
        run: |
          $project = 'organizer/src/Organizer.Desktop/Organizer.Desktop.csproj'
          try {
            Remove-Item Env:AVALONIA_TELEMETRY_OPTOUT
            dotnet msbuild $project -t:RequireAvaloniaTelemetryOptOut -p:UsedAvaloniaProducts=Organizer -p:AVALONIA_TELEMETRY_OPTOUT=1 *> organizer/artifacts/ci/telemetry-negative.log
            if ($LASTEXITCODE -eq 0) { throw 'Telemetry guard accepted a property without the actual environment opt-out.' }
            if (-not (Select-String -Path organizer/artifacts/ci/telemetry-negative.log -Pattern 'Set AVALONIA_TELEMETRY_OPTOUT=1' -Quiet)) { throw 'Negative preflight failed for an unexpected reason.' }
          } finally {
            $env:AVALONIA_TELEMETRY_OPTOUT = '1'
          }
          dotnet msbuild $project -t:RequireAvaloniaTelemetryOptOut -p:UsedAvaloniaProducts=Organizer *> organizer/artifacts/ci/telemetry-positive.log
          if ($LASTEXITCODE) { Get-Content organizer/artifacts/ci/telemetry-positive.log; exit $LASTEXITCODE }
      - name: Portable layout and optional installer parser regression
        run: |
          & pwsh -NoProfile -File organizer/packaging/windows/test-portable-layout.ps1 *> organizer/artifacts/ci/portable-layout.log
          $result = $LASTEXITCODE
          Get-Content organizer/artifacts/ci/portable-layout.log
          if ($result -ne 0) { exit $result }
          pwsh -NoProfile -File organizer/packaging/windows/test-inno-compiler.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Python lint and patch whitespace
        run: |
          python -m pip install --disable-pip-version-check ruff==0.12.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff check organizer/worker organizer/scripts organizer/packaging/windows --isolated
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organizer-checks-${{ matrix.os }}
          path: organizer/artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  windows-portable:
    name: Build and verify Windows portable ZIP
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.402'
          cache: true
          cache-dependency-path: organizer/**/packages*.lock.json
      - name: Package self-contained app and embedded Python in a portable ZIP
        id: package
        run: |
          New-Item -ItemType Directory -Force organizer/artifacts/ci | Out-Null
          & pwsh -NoProfile -File ./organizer/scripts/package-windows.ps1 -PackageKind portable -BuildLabel "ci-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT" *> organizer/artifacts/ci/package.log
          $result = $LASTEXITCODE
          Get-Content organizer/artifacts/ci/package.log
          if ($result -ne 0) { exit $result }
      - name: Extract, native startup, bundled worker, portable data and upgrade checks
        env:
          PORTABLE_ZIP: ${{ steps.package.outputs.portable_zip }}
        run: |
          & pwsh -NoProfile -File ./organizer/scripts/test-windows-portable.ps1 -Archive $env:PORTABLE_ZIP *> organizer/artifacts/ci/portable-test.log
          $result = $LASTEXITCODE
          Get-Content organizer/artifacts/ci/portable-test.log
          if ($result -ne 0) { exit $result }
      - name: Upload one verified portable ZIP directly
        id: portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.portable_zip }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Delivery summary
        env:
          ARTIFACT_URL: ${{ steps.portable.outputs.artifact-url }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          @"
          ## Windows x64 portable ZIP
          - Verified directly downloadable ZIP: $env:ARTIFACT_URL
          - SHA-256: $env:PACKAGE_SHA256
          - Extract once to a writable folder and run Organizer.Desktop.exe. No installer, registry or shortcut setup.
          - Program-adjacent data stays in data/. Close the app and back up data/ before replacing program files.
          - Includes self-contained .NET, isolated embedded Python, and hash-locked HTTP dependencies.
          - Preview-only; metadata networking defaults off. CI uses only fixtures and injected HTTP responses; no live source was verified.
          - Native Windows checks cover Chinese/space paths, bundled worker, read-only/junction errors, missing marker, and data-preserving overwrite upgrade.
          - Tests use generated temporary data, never user media. README and manifest are inside the ZIP.
          - No signing certificate, release, tag, auto-update or deployment is used.
          "@ >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve packaging and native smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organizer-windows-package-diagnostics
          path: |
            organizer/artifacts/ci/
            organizer/artifacts/windows-test/
          if-no-files-found: warn
          retention-days: 14
